<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body {
            text-align: center;
            background-image: url(D2Background.png);
            color: rgb(77, 44, 1);
            display: grid;
            place-items: center;
            font-family: heiti sc;
        }

        .header {
            background-color: rgb(247, 146, 52);
            padding: 1px;
            box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.2);
            -webkit-box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            width: 800px;
        }

        .review {
            background-color: rgb(255, 208, 146);
            box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.2);
            -webkit-box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 10px 10px 5px 0px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            width: 600px;
            padding: 20px;
        }

        #reviewtext {
            text-align: center;
            padding: 45px;
            width: 50%;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Rate a Movie</h1>
    </div>

    <p>Give a favorite movie and write your review.</p>


    <!-- REVIEW BOX -->
    <div class="review">

        <!-- IMAGE -->
        <img src="resized.png" alt="" width="15%" style="margin-bottom: 20px;"> <br>
        <input type="text" name="" id="" placeholder="Movie Title"
            style="width: 50%; padding: 10px; text-align: center;"> <br> <br>

        <!-- GENRES LIST -->
        <label for=""><strong>Genres:</strong> <em>(select all that apply)</em></label> <br>

        <input type="checkbox" name="" id="">
        <label for="">Action</label>

        <input type="checkbox" name="" id="">
        <label for="">Comedy</label>

        <input type="checkbox" name="" id="">
        <label for="">Drama</label>

        <input type="checkbox" name="" id="">
        <label for="">Fantasy</label>

        <input type="checkbox" name="" id="">
        <label for="">Sci-Fi</label> <br> <br>

        <!-- RATING RADIO -->
        <label for=""><strong>Rating:</strong></label> <br>

        <input type="radio" name="rate" id="">
        <label for="">⭐️</label>

        <input type="radio" name="rate" id="">
        <label for="">⭐️⭐️</label>

        <input type="radio" name="rate" id="">
        <label for="">⭐️⭐️⭐️</label>

        <input type="radio" name="rate" id="">
        <label for="">⭐️⭐️⭐️⭐️</label>

        <input type="radio" name="rate" id="">
        <label for="">⭐️⭐️⭐️⭐️⭐️</label> <br> <br>

        <textarea name="" id="reviewtext" placeholder="Write your review here"></textarea> <br>

        <!-- SUBMIT BUTTON -->
        <input type="submit" value="Submit" style="padding: 10px;
         width: 300px; 
         margin-top: 18px;
         background-color: rgb(247, 146, 52); 
         border: 2px solid;
         border-color: rgb(179, 87, 0)"> <br>

        <!-- LINK -->
        <a href=" https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/"
            style="font-size: 13px; margin-bottom: 15px;">Movie Review Tips</a>
    </div>
</body>

</html>
